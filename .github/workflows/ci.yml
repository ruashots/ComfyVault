name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The link tests make real symbolic links. Windows allows that to an
      # elevated process, which the hosted runner is, and to anyone with
      # Developer Mode on. Developer Mode is turned on as well, and the next
      # step proves a link can be made, so a runner that cannot fails here
      # instead of failing every link test at once.
      - name: Turn on Developer Mode (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
      - name: Prove a symbolic link can be made (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "linkprobe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path "$dir\target.txt" -Value "probe"
          New-Item -ItemType SymbolicLink -Path "$dir\link.txt" -Target "$dir\target.txt" | Out-Null
          if ((Get-Content "$dir\link.txt") -ne "probe") { throw "the link does not read its target" }
          whoami /priv | Select-String SeCreateSymbolicLinkPrivilege

      - name: Linux libraries for the desktop layer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Interface tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      # Also what the desktop layer embeds, so it is built before cargo runs.
      - name: Production interface build
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --workspace --locked
