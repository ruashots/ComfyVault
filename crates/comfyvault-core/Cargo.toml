[package]
name = "comfyvault-core"
description = "ComfyVault engine: scan, deduplicate and consolidate ComfyUI model weights into one vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true

redb = "3"
sha2 = "0.10"
walkdir = "2"
rayon = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
serde_yaml_ng = "0.10"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["json", "native-tls", "gzip"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_RestartManager",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
# Exposes the fake platform and the in-process HTTP test server to other crates.
testing = []
