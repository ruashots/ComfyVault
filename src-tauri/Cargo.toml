[package]
name = "comfyvault"
description = "ComfyVault: one copy of every model weight, a link everywhere it used to be."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The desktop application is a library plus a thin binary, which is what lets
# the same code run on every platform Tauri supports.
name = "comfyvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
comfyvault-core = { path = "../crates/comfyvault-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-single-instance = "2"

[dev-dependencies]
# The mock runtime, so a test can drive the real plugins through the real
# capability file without a window.
tauri = { version = "2", features = ["test"] }

[features]
default = []
# Without this, Tauri does NOT embed the built frontend: the application falls
# back to the development server URL and shows an empty window. The Tauri CLI
# turns it on for `tauri build`, so a hand-rolled `cargo build` of a shipping
# binary has to pass it too. Do not remove it.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dev-dependencies]
# The second-launch test drives real windows of the real built program.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
